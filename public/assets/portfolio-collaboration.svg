<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Background -->
  <rect width="800" height="450" fill="#0B0F17"/>
  <rect x="20" y="20" width="760" height="410" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>

  <!-- Browser Header -->
  <rect x="20" y="20" width="760" height="44" rx="16" fill="#1F2937"/>
  <rect x="20" y="52" width="760" height="12" fill="#1F2937"/>
  <circle cx="48" cy="42" r="5" fill="#EF4444"/>
  <circle cx="66" cy="42" r="5" fill="#F59E0B"/>
  <circle cx="84" cy="42" r="5" fill="#10B981"/>
  <rect x="110" y="32" width="280" height="20" rx="6" fill="#374151"/>
  <text x="122" y="46" font-family="'Rubik', sans-serif" font-size="11" fill="#9CA3AF" font-weight="500">live-cobrowse.luxonixstacks.internal/session</text>

  <!-- Main Co-browsing Stage -->
  <rect x="40" y="84" width="520" height="324" rx="12" fill="#030712" stroke="#374151" stroke-width="1"/>
  <rect x="60" y="104" width="480" height="240" rx="8" fill="#1F2937"/>
  <!-- Wireframe web page being co-browsed -->
  <rect x="80" y="124" width="140" height="14" rx="4" fill="#374151"/>
  <rect x="80" y="148" width="440" height="40" rx="6" fill="#111827"/>
  <rect x="80" y="198" width="210" height="90" rx="6" fill="#111827"/>
  <rect x="310" y="198" width="210" height="90" rx="6" fill="#111827"/>

  <!-- Live Cursor 1 (Host) -->
  <g transform="translate(240, 160)">
    <polygon points="0,0 12,18 7,18 4,24 1,23 4,17 0,16" fill="#3B82F6"/>
    <rect x="16" y="12" width="54" height="18" rx="4" fill="#3B82F6"/>
    <text x="22" y="24" font-family="'Rubik', sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">Support</text>
  </g>

  <!-- Live Cursor 2 (Customer) -->
  <g transform="translate(380, 240)">
    <polygon points="0,0 12,18 7,18 4,24 1,23 4,17 0,16" fill="#10B981"/>
    <rect x="16" y="12" width="48" height="18" rx="4" fill="#10B981"/>
    <text x="22" y="24" font-family="'Rubik', sans-serif" font-size="9" fill="#FFFFFF" font-weight="600">Client</text>
  </g>

  <!-- Right Video Call & Controls Sidebar -->
  <g transform="translate(580, 84)">
    <!-- Video Stream 1 -->
    <rect x="0" y="0" width="180" height="120" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <circle cx="90" cy="52" r="24" fill="#374151"/>
    <text x="90" y="58" font-family="'Rubik', sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Agent</text>
    <rect x="12" y="90" width="60" height="18" rx="4" fill="#000000" fill-opacity="0.6"/>
    <text x="20" y="102" font-family="'Rubik', sans-serif" font-size="9" fill="#10B981">● LiveKit</text>

    <!-- Video Stream 2 -->
    <rect x="0" y="132" width="180" height="120" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <circle cx="90" cy="184" r="24" fill="#374151"/>
    <text x="90" y="190" font-family="'Rubik', sans-serif" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">User</text>
    <rect x="12" y="222" width="64" height="18" rx="4" fill="#000000" fill-opacity="0.6"/>
    <text x="20" y="234" font-family="'Rubik', sans-serif" font-size="9" fill="#60A5FA">● WebRTC</text>

    <!-- Call Controls -->
    <rect x="0" y="264" width="180" height="60" rx="12" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <circle cx="45" cy="294" r="16" fill="#10B981"/>
    <circle cx="90" cy="294" r="16" fill="#374151"/>
    <circle cx="135" cy="294" r="16" fill="#EF4444"/>
  </g>
</svg>

